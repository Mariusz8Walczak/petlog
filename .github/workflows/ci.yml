name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # vite build's SvelteKit postbuild "analyse" step imports server code
      # (src/lib/server/db/index.ts) to inspect routes, which throws if this
      # isn't set — no real DB connectivity is needed for that, just a value.
      DATABASE_URL: file:./data/petlog.db
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      DATABASE_URL: file:./data/petlog.db
      SEED_EMAIL: e2e@petlog.local
      SEED_PASSWORD: ci-only-not-a-real-password-123
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # pnpm run test:e2e = build, then Playwright, whose globalSetup
      # (e2e/global-setup.ts) runs db:migrate + seed before the suite.
      - name: E2E tests
        run: pnpm run test:e2e
