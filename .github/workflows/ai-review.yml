name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff against base branch
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          git diff "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- . ':!pnpm-lock.yaml' > diff.txt
          # guard against oversized diffs blowing the model's context budget
          head -c 60000 diff.txt > diff.trimmed.txt && mv diff.trimmed.txt diff.txt
          echo "Diff size: $(wc -l < diff.txt) lines"

      - name: Run AI review (GitHub Models, no API key needed)
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: claude-sonnet-4.5
          system-prompt-file: .github/prompts/review-system-prompt.md
          prompt-file: diff.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format review comment
        id: format
        run: node scripts/ai-review-comment.mjs "${{ steps.ai.outputs.response-file }}" ai-review-comment.md

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file ai-review-comment.md --repo "${{ github.repository }}"

      - name: Gate on blocking criteria
        if: steps.format.outputs.verdict == 'changes_requested'
        run: |
          echo "::error::Blocking review criteria failed — see the AI review comment on this PR."
          exit 1
